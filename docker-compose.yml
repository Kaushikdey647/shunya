# Full stack: TimescaleDB + FastAPI (uvicorn + in-process backtest worker) + static UI (nginx → /api).
# Run: docker compose up --build
# UI: http://localhost:8080  (nginx proxies /api to the api service)
# API direct: http://localhost:8000  (optional; use for /docs or curl without nginx)
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shunya
    volumes:
      - shunya_ts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shunya"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/shunya
      RUN_MIGRATIONS: "1"
    depends_on:
      timescaledb:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  shunya_ts_data:
