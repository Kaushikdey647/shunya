# Full stack: TimescaleDB + FastAPI (uvicorn + in-process backtest worker) + static UI (nginx → /api).
# Run: docker compose up --build
# Optional: cp .env.example .env — api service loads env_file (.env, required: true) for SHUNYA_API_*, APCA_*, etc.
# Local Compose defaults SHUNYA_TLS_VERIFY=0 (relaxed TLS for yfinance curl_cffi + Alpaca behind corporate inspection).
# Set SHUNYA_TLS_VERIFY=1 in .env for strict verification when your CA bundle trusts upstreams.
# DATABASE_URL in this file overrides .env so the API targets the timescaledb service inside the network.
# UI: http://localhost:8080  (nginx proxies /api to the api service)
# API direct: http://localhost:8000  (optional; use for /docs or curl without nginx)
#
# The bootstrap service runs once per compose up: migrations, then (if the DB looks empty) Yahoo ingest
# scripts. Set SHUNYA_COMPOSE_AUTO_BOOTSTRAP=0 to run migrations only. First full ingest can take a long time.
x-api-build: &api_build
  context: .
  dockerfile: Dockerfile

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shunya
    volumes:
      - shunya_ts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shunya"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build: *api_build
    entrypoint: ["/bin/sh", "/app/docker/compose-bootstrap.sh"]
    command: []
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/shunya
      SHUNYA_COMPOSE_AUTO_BOOTSTRAP: ${SHUNYA_COMPOSE_AUTO_BOOTSTRAP:-1}
      SHUNYA_TLS_VERIFY: ${SHUNYA_TLS_VERIFY:-0}
    env_file:
      - path: .env
        required: false
    depends_on:
      timescaledb:
        condition: service_healthy

  api:
    build: *api_build
    # Optional: repo-root .env (e.g. Alpaca, Ollama). Compose 2.24+; ignored if .env is missing.
    env_file:
      - path: .env
        required: true
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/shunya
      RUN_MIGRATIONS: "1"
      SHUNYA_TLS_VERIFY: ${SHUNYA_TLS_VERIFY:-0}
    depends_on:
      timescaledb:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  shunya_ts_data:
