site_name: Shunya
site_description: Systematic equity research — panels, JAX alphas, backtests, OMS/EMS.
site_url: https://kaushikdey647.github.io/shunya/
repo_url: https://github.com/Kaushikdey647/shunya
repo_name: Kaushikdey647/shunya
docs_dir: docs
site_dir: site
strict: true

exclude_docs: |
  ssrn*.pdf

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid must use a Superfences custom fence so ```mermaid is not eaten by Highlight.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

# Required for pymdownx.arithmatex (generic): config + MathJax runtime (Material docs).
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mermaid2:
      version: "10.4.0"
      javascript: javascripts/mermaid.min.js
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Glossary: glossary.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Concepts:
      - Introduction: concepts/index.md
      - "Alphas, metrics, and evaluation": concepts/alphas-metrics-and-evaluation.md
      - "Portfolios, construction, and PMS": concepts/portfolios-construction-and-pms.md
      - "OMS, EMS, and order routing": concepts/oms-ems-and-order-routing.md
      - "Pipeline: alpha to execution": concepts/pipeline-alpha-to-execution.md
      - "Alpha styles and Shunya patterns": concepts/alpha-styles-and-shunya-patterns.md
      - "Fundamentals for alphas": concepts/fundamentals-for-alphas.md
      - "Alpha design: rank, z-score, gates": concepts/alpha-design-rank-zscore-and-gates.md
  - Documentation:
      - "System overview": documentation/system-overview.md
      - "Data layer: finTs and providers": documentation/fints-providers.md
      - "Signals: FinStrat and FinBT": documentation/finstrat-finbt.md
      - Portfolio construction and risk: documentation/portfolio-risk.md
      - "Execution: OMS, EMS, live desk": documentation/oms-ems.md
      - Operators and cross-section: documentation/operators.md
  - How-to guides:
      - "Local dev: API, worker, and UI": how-to/local-dev-api-ui.md
      - Timescale first-run checklist: how-to/timescale-checklist.md
      - Backtest from the web UI: how-to/backtest-from-ui.md
      - Paper trading cycle (API): how-to/paper-cycle-api.md
      - "Alpha Studio: AI assist and DSL": how-to/alpha-studio-ai-dsl.md
  - Web application:
      - Overview: ui/overview.md
      - Research: ui/research.md
      - Studio: ui/studio.md
      - Trade: ui/trade.md
      - Configuration: ui/configuration.md
  - HTTP API: http-api.md
  - Data & integrations:
      - Local Timescale: data_timescale.md
      - Alpha Vantage: alpha-vantage.md
      - "ADR 001: layering": adr/001-architecture-layers.md
  - Reference:
      - reference/index.md
      - "Python package (shunya)": reference/library.md
