site_name: Shunya
site_description: Systematic equity research — panels, JAX alphas, backtests, OMS/EMS.
site_url: https://kaushikdey647.github.io/shunya/
repo_url: https://github.com/Kaushikdey647/shunya
repo_name: Kaushikdey647/shunya
docs_dir: docs
site_dir: site
strict: true

exclude_docs: |
  ssrn*.pdf

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Install: install.md
  - Guides:
      - Local Timescale: data_timescale.md
      - Alpha Vantage: alpha-vantage.md
      - "ADR 001: layering": adr/001-architecture-layers.md
  - HTTP API: http-api.md
  - Reference:
      - reference/index.md
      - "Python package (shunya)": reference/library.md
