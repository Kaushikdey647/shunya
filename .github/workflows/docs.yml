# Publishes the MkDocs `site/` output (Material theme + sidebar).
#
# If the live site shows a plain page with no left nav: GitHub repo
# Settings → Pages → Build and deployment → Source must be **GitHub Actions**,
# not "Deploy from a branch" (Jekyll on Markdown). See docs/how-to/documentation-site-github-pages.md.
name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "shunya/**"
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-shunya-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Install dependencies
        run: uv sync --frozen --group docs --extra api

      - name: Build MkDocs
        run: uv run mkdocs build --strict

      # MkDocs ignores dotfiles in docs/; GitHub Pages must not Jekyll-process this artifact.
      - name: Add .nojekyll to site root
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
